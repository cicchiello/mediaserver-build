# -----------------------------------------------------------
# HTTP VIRTUAL HOST
# -----------------------------------------------------------
<VirtualHost *:80>
    ServerName db.jfcenterprises.com
    DocumentRoot /var/www/html

    # Redirect all HTTP requests to HTTPS
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =db.jfcenterprises.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    # Optional logging
    ErrorLog ${APACHE_LOG_DIR}/db-http-error.log
    CustomLog ${APACHE_LOG_DIR}/db-http-access.log combined
</VirtualHost>

# -----------------------------------------------------------
# HTTPS VIRTUAL HOST
# -----------------------------------------------------------
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName db.jfcenterprises.com
        DocumentRoot /var/www/html

        SSLEngine on

        # Let's Encrypt certificate & key paths
        # Adjust if using a different cert location (e.g. DNS-01 challenge)
        SSLCertificateFile /home/USERNAME/photos/letsencrypt/live/db.jfcenterprises.com/fullchain.pem
        SSLCertificateKeyFile /home/USERNAME/photos/letsencrypt/live/db.jfcenterprises.com/privkey.pem

        # Optional logging
        ErrorLog ${APACHE_LOG_DIR}/db-https-error.log
        CustomLog ${APACHE_LOG_DIR}/db-https-access.log combined

        <Directory /var/www/html>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
</IfModule>
