logger: {
  format: Raw
  output: Stdout
  level: info
}
config: [
  {
    node: {
      name: clouseau
      domain: 127.0.0.1
      cookie: COUCHDB_COOKIE (don't change; taken from couchdb-secrets.sh)
    }
    clouseau: {
      dir: <path/to/couchdb/shards>
      max_indexes_open: 500
    }
  }
]